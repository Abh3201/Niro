name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    # For the storage tests (apps/realtime/src/postgres.test.ts), which fail in CI without it.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: niro
          POSTGRES_PASSWORD: niro
          POSTGRES_DB: niro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U niro -d niro_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://niro:niro@localhost:5432/niro_test
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci .
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      # Frame times on the 10,000-shape benchmark board, for comparing runs.
      # Never fails the build: shared runners (with software rendering) are
      # too noisy to hold a threshold. The table goes in the job summary.
      - name: Frame times (recorded, not checked)
        run: pnpm bench
        continue-on-error: true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench-results.json
          if-no-files-found: ignore
          retention-days: 90

  compose:
    name: Docker compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Make a secret, as the README says to
        run: echo "NIRO_SECRET=$(openssl rand -hex 32)" > .env
      - run: docker compose up --build --wait --wait-timeout 300
      - name: Web app serves the board
        # "/" redirects to a new board at /b/<id>; -L follows it.
        run: curl -fsSL http://localhost:3000/ | grep -q 'data-testid="board"'
      - name: Realtime server is healthy
        run: curl -fsS http://localhost:8787/healthz | grep -q '"ok"'
      - name: Realtime server set up its tables and serves metrics
        run: |
          docker compose exec -T postgres psql -U niro -d niro -tAc "SELECT max(version) FROM niro_migrations" | grep -qx 3
          curl -fsS http://localhost:8787/metrics | grep -q '^niro_rooms 0$'
      - name: The HTTPS setup from docs/self-hosting.md serves the board through Caddy
        # For localhost, Caddy uses a certificate of its own (-k), not Let's Encrypt.
        run: |
          echo "NIRO_DOMAIN=localhost" >> .env
          echo "COMPOSE_FILE=docker-compose.yml:compose.https.yml" >> .env
          docker compose up -d --wait --wait-timeout 120
          curl -fsSkL --retry 10 --retry-all-errors --retry-delay 2 https://localhost/ | grep -q 'data-testid="board"'
          curl -sSk -o /dev/null -w '%{http_code}' https://localhost/metrics | grep -qx 404
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
