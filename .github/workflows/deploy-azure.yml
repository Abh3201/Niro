# Deploy main after CI passes on it: the realtime server to Azure App Service,
# and the web app to Azure, Vercel, or both. See docs/deploy-azure.md, "Deploy
# automatically from GitHub", and docs/deploy-vercel.md. Does nothing until the
# repository variable AZURE_WEBAPP_REALTIME is set; each web app step also
# needs its own variable (AZURE_WEBAPP_WEB, VERCEL_PROJECT_ID).
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One deploy at a time, and a newer one waits instead of cancelling a deploy halfway.
concurrency:
  group: deploy-azure
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    if: >-
      vars.AZURE_WEBAPP_REALTIME != '' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # The commit CI passed on, not whatever main is now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: ./deploy/azure/package.sh
      # Realtime first: it writes every open board when it stops, and the new
      # web app must not reach browsers before the server it talks to.
      - name: Deploy the realtime server
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_REALTIME }}
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE_REALTIME }}
          package: out/azure/realtime.zip
      - name: Deploy the web app to Azure
        if: vars.AZURE_WEBAPP_WEB != ''
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_WEB }}
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE_WEB }}
          package: out/azure/web.zip
      # Vercel's own Git deploys are off (apps/web/vercel.json), so the web app
      # never goes out before CI passes or before the realtime server it talks to.
      - name: Deploy the web app to Vercel
        if: vars.VERCEL_PROJECT_ID != ''
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx --yes vercel@63.1.2 pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@63.1.2 build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@63.1.2 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
      - name: Check the realtime server answers
        run: |
          for _ in 1 2 3 4 5 6; do
            curl -fsS "https://${{ vars.AZURE_WEBAPP_REALTIME }}.azurewebsites.net/healthz" && exit 0
            sleep 20
          done
          exit 1
