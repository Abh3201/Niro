# Deploy main to Azure App Service after CI passes on it. See docs/deploy-azure.md,
# "Deploy automatically from GitHub". Does nothing until the repository
# variables AZURE_WEBAPP_REALTIME and AZURE_WEBAPP_WEB are set.
name: Deploy to Azure

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One deploy at a time, and a newer one waits instead of cancelling a deploy halfway.
concurrency:
  group: deploy-azure
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    if: >-
      vars.AZURE_WEBAPP_REALTIME != '' && vars.AZURE_WEBAPP_WEB != '' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # The commit CI passed on, not whatever main is now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: ./deploy/azure/package.sh
      # Realtime first: it writes every open board when it stops, and the new
      # web app must not reach browsers before the server it talks to.
      - name: Deploy the realtime server
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_REALTIME }}
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE_REALTIME }}
          package: out/azure/realtime.zip
      - name: Deploy the web app
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_WEB }}
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE_WEB }}
          package: out/azure/web.zip
      - name: Check the realtime server answers
        run: |
          for _ in 1 2 3 4 5 6; do
            curl -fsS "https://${{ vars.AZURE_WEBAPP_REALTIME }}.azurewebsites.net/healthz" && exit 0
            sleep 20
          done
          exit 1
