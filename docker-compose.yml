# Self-host Niro: put NIRO_SECRET in .env (see .env.example), run
# `docker compose up --build`, then open http://localhost:3000
name: niro

services:
  web:
    build:
      context: .
      target: web
    environment:
      NIRO_SECRET: ${NIRO_SECRET:?Set NIRO_SECRET in .env first. Make one with openssl rand -hex 32}
      PUBLIC_REALTIME_URL: ${PUBLIC_REALTIME_URL:-}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      realtime:
        condition: service_healthy

  realtime:
    build:
      context: .
      target: realtime
    # On stop it writes every open board first; give a slow database time.
    stop_grace_period: 30s
    environment:
      NIRO_SECRET: ${NIRO_SECRET:?Set NIRO_SECRET in .env first. Make one with openssl rand -hex 32}
      DATABASE_URL: postgres://niro:${POSTGRES_PASSWORD:-niro}@postgres:5432/niro
      # Optional; see .env.example. Empty means the default.
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      NIRO_MAX_SHAPES: ${NIRO_MAX_SHAPES:-}
      NIRO_MAX_BOARD_MB: ${NIRO_MAX_BOARD_MB:-}
      NIRO_MAX_CONNECTIONS_PER_BOARD: ${NIRO_MAX_CONNECTIONS_PER_BOARD:-}
      NIRO_MAX_OPEN_MB: ${NIRO_MAX_OPEN_MB:-}
      NIRO_MAX_CONNECTIONS: ${NIRO_MAX_CONNECTIONS:-}
    ports:
      - "${REALTIME_PORT:-8787}:8787"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: niro
      POSTGRES_DB: niro
      # Change this for any deployment that isn't on your own machine.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-niro}
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/, so mount the parent.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U niro -d niro"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
